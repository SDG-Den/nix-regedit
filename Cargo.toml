[package]
name = "nix-regedit"
version = "0.1.0"
edition = "2021"
description = "A registry-editor style GUI for Nix flakes"

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7", default-features = false }
rnix = "0.11"
rowan = "0.15"
serde_json = "1.0"
async-channel = "2"

[[bin]]
name = "nix-regedit"
path = "src/main.rs"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 2
codegen-units = 256
strip = "debuginfo"
